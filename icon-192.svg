<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Pi symbol -->
  <text x="150" y="180" font-family="Georgia, serif" font-size="140" font-weight="bold" fill="url(#mathGrad)" opacity="0.7">π</text>

  <!-- Square root and equation -->
  <g transform="translate(256, 300)" fill="url(#mathGrad)" stroke="url(#mathGrad)" stroke-width="6">
    <!-- Square root -->
    <path d="M-120,-50 L-100,-50 L-80,-20 L-40,-80" fill="none"/>
    <line x1="-40" y1="-80" x2="0" y2="-80"/>

    <!-- Equals -->
    <line x1="20" y1="-70" x2="80" y2="-70"/>
    <line x1="20" y1="-50" x2="80" y2="-50"/>

    <!-- Variable -->
    <text x="110" y="-45" font-family="Georgia, serif" font-size="50" font-style="italic">x</text>
  </g>

  <!-- Geometry shapes -->
  <g transform="translate(340, 140)" stroke="url(#mathGrad)" stroke-width="5" fill="none" opacity="0.6">
    <circle cx="0" cy="0" r="35"/>
    <polygon points="-25,50 0,10 25,50"/>
  </g>

  <!-- LC badge -->
  <g transform="translate(380, 420)">
    <rect x="-45" y="-25" width="90" height="50" rx="12" fill="#3b82f6"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e3a8a" text-anchor="middle">LC</text>
  </g>
</svg>
